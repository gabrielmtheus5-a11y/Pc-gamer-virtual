## 📌 Como usar este repositório

1. Copie o script PowerShell acima
2. Salve como `setup.ps1` no seu PC
3. Abra o PowerShell como Administrador
4. Execute: `.\setup.ps1`
5. Pronto! Todos os programas serão instalados automaticamente

