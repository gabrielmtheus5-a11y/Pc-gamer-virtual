## 🚀 Otimizações para Máximo FPS

### BIOS
- Ativar **EXPO/DOCP** para a RAM rodar em 6400MHz
- Ativar **Re-Size BAR** (Smart Access Memory)
- Desativar serviços desnecessários (áudio onboard se usar USB, etc)

### Windows
- Plano de energia: **Alto Desempenho**
- Ativar **Modo de Jogo** nas configurações
- Desativar **HAGS** se causar instabilidade
- Drivers NVIDIA: Ativar **Modo de Baixa Latência** e **DLSS**

### NVIDIA Control Panel
- Modo de gerenciamento de energia: **Desempenho máximo**
- Filtro de textura: **Alto desempenho**
- Modo de baixa latência: **Ultra**

