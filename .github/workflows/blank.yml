## ⚡ Script de Instalação Automática

Este script instala todos os programas essenciais no seu PC novo.

```powershell
# ============================================
# SCRIPT DE INSTALAÇÃO - PC GAMER ENDGAME
# ============================================

Write-Host "🚀 Iniciando instalação do PC Gamer..." -ForegroundColor Green
Write-Host ""

# 1. Navegadores
Write-Host "📌 Instalando navegadores..." -ForegroundColor Yellow
winget install Mozilla.Firefox
winget install Google.Chrome

# 2. Plataformas de Jogos
Write-Host "🎮 Instalando plataformas de jogos..." -ForegroundColor Yellow
winget install Valve.Steam
winget install EpicGames.EpicGamesLauncher
winget install RiotGames.LeagueOfLegends
winget install BattleNet

# 3. Comunicação
Write-Host "💬 Instalando apps de comunicação..." -ForegroundColor Yellow
winget install Discord.Discord
winget install Telegram.TelegramDesktop
winget install WhatsApp

# 4. Ferramentas de Monitoramento
Write-Host "📊 Instalando ferramentas de monitoramento..." -ForegroundColor Yellow
winget install TechPowerUp.GPU-Z
winget install CPUID.CPU-Z
winget install MSI.Afterburner
winget install HWiNFO.HWiNFO

# 5. Drivers e Utilitários
Write-Host "⚙️ Instalando drivers e utilitários..." -ForegroundColor Yellow
winget install Nvidia.GeForceExperience
winget install 7zip.7zip
winget install VideoLAN.VLC

Write-Host ""
Write-Host "✅ Instalação concluída com sucesso!" -ForegroundColor Cyan
Write-Host "🔄 Reinicie o PC para finalizar." -ForegroundColor Cyan
```

